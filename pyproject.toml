[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "elementwise-udf"
version = "0.2.0"
description = "Use Python UDFs inside Spark's native higher-order functions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Hyukjin Kwon" }]
keywords = ["spark", "pyspark", "udf", "higher-order-functions", "databricks"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# PySpark is deliberately NOT a hard dependency: this is used inside an existing
# Spark environment (a cluster, Databricks Connect, a notebook image) that
# already provides its own pyspark, and pinning one here would fight it. Install
# the `spark` extra to pull one in for local use.
dependencies = []

[project.optional-dependencies]
spark = ["pyspark>=4.0"]
connect = ["pyspark[connect]>=4.0"]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "black>=24",
    "pyspark[connect]>=4.0",
]

[project.urls]
Homepage = "https://github.com/HyukjinKwon/elementwise-udf"
Repository = "https://github.com/HyukjinKwon/elementwise-udf"
Issues = "https://github.com/HyukjinKwon/elementwise-udf/issues"
Changelog = "https://github.com/HyukjinKwon/elementwise-udf/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["elementwise_udf*"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["elementwise_udf"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
