name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
        # Classic and Connect sessions cannot coexist in one process, so each
        # mode gets its own run.
        spark-mode: [classic, connect]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: black --line-length 100 --check .
      - run: pytest -q
        env:
          SPARK_MODE: ${{ matrix.spark-mode }}
