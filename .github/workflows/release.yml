# SPDX-License-Identifier: Apache-2.0
#
# release.yml - publish elementwise-udf on a version tag.
#
# Triggers:
#   * push of a tag matching  v*        -> release to PyPI + a GitHub Release
#   * workflow_dispatch (dry_run input) -> build only, or publish to TestPyPI,
#                                          never touching real PyPI / Releases
#
# Publishing uses an API token in the repo secret `PYPI_TOKEN`
# (pypa/gh-action-pypi-publish implies the `__token__` username). The TestPyPI
# dry-run path uses OIDC instead.
#
# Before anything is published the wheel is built, installed, imported, and
# metadata-checked, and the tag is required to match the packaged version - so a
# mistyped tag fails the run rather than shipping a mislabelled release.

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: >-
          Build + verify only. If 'testpypi', also upload to TestPyPI via OIDC.
          Never publishes to real PyPI and never creates a GitHub Release.
        type: choice
        default: "build-only"
        options:
          - "build-only"
          - "testpypi"

# Least privilege by default; jobs widen only what they need.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build sdist + wheel, verify them, and resolve the version. Single source
  #    of the dist artifacts every later job consumes.
  # ---------------------------------------------------------------------------
  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist + wheel
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          # Pin matches ci.yml's build-wheel job.
          python -m pip install "build==1.2.2"
          python -m build --sdist --wheel --outdir dist
          ls -la dist

      - name: Assert the wheel declares no hard dependency
        # pyspark must stay behind an extra: the package is installed into an
        # existing Spark environment that already provides its own. Mirrors
        # ci.yml's build-wheel job, so the publish path carries the same guard.
        run: |
          set -euxo pipefail
          python -m pip install dist/elementwise_udf-*.whl
          python - <<'PY'
          import importlib.metadata as m

          reqs = m.requires("elementwise-udf") or []
          hard = [r for r in reqs if "extra ==" not in r]
          assert not hard, f"wheel declares hard dependencies: {hard}"
          print("OK: every requirement is behind an extra")
          PY

      - name: Install pyspark, then import the wheel
        # The import needs pyspark, exactly as a real environment provides it;
        # the step above already proved pip does not pull one in by itself.
        run: |
          set -euxo pipefail
          python -m pip install "pyspark[connect]>=4.0"
          python -c "
          import elementwise_udf.functions as esf
          print('import OK', esf.udf.__name__, esf.transform.__name__)
          "

      - name: twine check (PyPI metadata + long-description render)
        run: |
          set -euxo pipefail
          # twine >= 6.1 (pkginfo >= 1.12) is needed to parse Metadata-Version 2.4
          # from modern setuptools; older twine reports a bogus "missing Name".
          python -m pip install "twine>=6.1.0"
          twine check dist/*

      - name: Resolve version (tag must match on a tag push)
        id: ver
        run: |
          set -euxo pipefail
          # Derive from the wheel filename: pyproject.toml is the single source of
          # truth, so there is no second place to drift.
          whl="$(ls dist/elementwise_udf-*.whl)"
          version="$(basename "$whl" | sed -E 's/^elementwise_udf-([^-]+)-.*/\1/')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "built version: ${version}"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "${tag}" != "${version}" ]; then
              echo "::error::tag '${GITHUB_REF_NAME}' (=> ${tag}) != package version '${version}' - bump pyproject.toml to match the tag."
              exit 1
            fi
            echo "tag ${GITHUB_REF_NAME} matches package version ${version}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 2. Re-run the suite on the newest and oldest supported Spark before
  #    publishing, in both session modes. A release must never ship red.
  # ---------------------------------------------------------------------------
  verify:
    name: pytest (spark ${{ matrix.spark }}, ${{ matrix.spark-mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        spark: ["4.0.4", "4.2.0"]
        spark-mode: [classic, connect]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "pyspark[connect]==${{ matrix.spark }}"
      - env:
          SPARK_MODE: ${{ matrix.spark-mode }}
        run: pytest -q

  # ---------------------------------------------------------------------------
  # 3a. Publish to PyPI - REAL TAG PUSHES ONLY.
  # ---------------------------------------------------------------------------
  publish-pypi:
    name: publish to PyPI (API token)
    needs: [build, verify]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # API token in the repo secret PYPI_TOKEN; the `__token__` username is
          # implied when a password is supplied. repository-url defaults to PyPI.
          password: ${{ secrets.PYPI_TOKEN }}

  # ---------------------------------------------------------------------------
  # 3b. workflow_dispatch dry-run: TestPyPI via OIDC, never real PyPI.
  # ---------------------------------------------------------------------------
  publish-testpypi:
    name: publish to TestPyPI (dry-run, OIDC)
    needs: [build, verify]
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/elementwise-udf/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  # ---------------------------------------------------------------------------
  # 4. Cut the GitHub Release, with notes from CHANGELOG.md. TAG PUSHES ONLY.
  # ---------------------------------------------------------------------------
  github-release:
    name: GitHub Release (notes from CHANGELOG.md)
    needs: [build, publish-pypi]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the Release + upload assets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Extract release notes for this tag from CHANGELOG.md
        id: notes
        run: |
          set -euo pipefail
          version="${{ needs.build.outputs.version }}"
          # Keep a Changelog format: "## [X.Y.Z] - DATE". Copy that section up to
          # (not including) the next "## [" heading.
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { grab=1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::no CHANGELOG.md section for ${version}; using a generated note"
            printf 'Release %s. See CHANGELOG.md.\n' "$version" > release-notes.md
          fi
          echo "----- release notes -----"
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ needs.build.outputs.version }}"
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(needs.build.outputs.version, 'dev') || contains(needs.build.outputs.version, 'rc') || contains(needs.build.outputs.version, 'a') || contains(needs.build.outputs.version, 'b') }}
          files: |
            dist/*
